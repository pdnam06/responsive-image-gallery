<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">KHÁM PHÁ THIÊN NHIÊN</p>
            <h1>Responsive Image Gallery</h1>
            <p class="intro">Bốn khung cảnh, một hành trình. Thu nhỏ trình duyệt để xem Gallery tự thay đổi bố cục.</p>
        </header>
        <section class="gallery-grid" aria-label="Bộ sưu tập ảnh phong cảnh">
            <div class="responsive">
                <figure class="gallery">
                    <a href="images/mountains.svg" target="_blank" rel="noopener noreferrer" aria-label="Mở ảnh núi trong tab mới"><img src="images/mountains.svg" alt="Dãy núi phủ tuyết dưới bầu trời xanh" width="800" height="600"></a>
                    <figcaption><span>01 / NÚI NON</span><h2>Chạm đến chân trời</h2><p>Những đỉnh núi yên bình dưới ánh nắng sớm.</p></figcaption>
                </figure>
            </div>
            <div class="responsive">
                <figure class="gallery">
                    <a href="images/forest.svg" target="_blank" rel="noopener noreferrer" aria-label="Mở ảnh rừng trong tab mới"><img src="images/forest.svg" alt="Rừng thông xanh bên hồ nước trong veo" width="800" height="600"></a>
                    <figcaption><span>02 / RỪNG XANH</span><h2>Một khoảng lặng</h2><p>Đắm mình trong sắc xanh của rừng và hồ nước.</p></figcaption>
                </figure>
            </div>
            <div class="responsive">
                <figure class="gallery">
                    <a href="images/coast.svg" target="_blank" rel="noopener noreferrer" aria-label="Mở ảnh biển trong tab mới"><img src="images/coast.svg" alt="Bờ biển với cát vàng và làn sóng màu ngọc lam" width="800" height="600"></a>
                    <figcaption><span>03 / BIỂN CẢ</span><h2>Nơi sóng vỗ về</h2><p>Gió biển và những con sóng dịu dàng trên bờ cát.</p></figcaption>
                </figure>
            </div>
            <div class="responsive">
                <figure class="gallery">
                    <a href="images/aurora.svg" target="_blank" rel="noopener noreferrer" aria-label="Mở ảnh cực quang trong tab mới"><img src="images/aurora.svg" alt="Cực quang xanh và tím trên bầu trời đêm đầy sao" width="800" height="600"></a>
                    <figcaption><span>04 / BẦU TRỜI</span><h2>Ánh sáng phương Bắc</h2><p>Những dải sáng kỳ diệu giữa màn đêm tĩnh lặng.</p></figcaption>
                </figure>
            </div>
        </section>
        <footer>Nhấn vào ảnh để xem lớn hơn · Ảnh minh họa SVG được tạo cho bài thực hành.</footer>
    </main>
</body>
</html>
